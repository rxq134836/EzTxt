<!DOCTYPE html>
<!-- 独立设置窗口：由主窗口「设置」按钮打开（main.js openSettingsWindow） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>EzTxt 设置</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="amber">
  <div class="settings-window">
    <!-- 标题栏：可拖动（app-region: drag） -->
    <header class="settings-win-header">
      <h1>EzTxt 设置</h1>
      <button class="ctrl-btn close-btn" id="winClose" title="关闭" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3.7 3.7 L12.3 12.3 M12.3 3.7 L3.7 12.3"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div class="settings-scroll">
      <section class="settings-section">
        <h3>外观</h3>

        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">主题颜色</span>
          </div>
          <div class="theme-swatches" id="themeSwatches"></div>
        </div>

        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">材质</span>
          </div>
          <div class="material-options" id="materialOptions">
            <button class="material-btn" type="button" data-material="translucent">半透明</button>
            <button class="material-btn" type="button" data-material="acrylic">亚克力</button>
          </div>
        </div>

        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">页面字体大小</span>
            <span class="settings-value" id="fontSizeValue">13px</span>
          </div>
          <input type="range" id="fontSizeSlider" min="11" max="17" step="0.5" value="13" />
          <div class="range-labels"><span>小</span><span>大</span></div>
        </div>

        <div class="settings-block" id="bgOpacityBlock">
          <div class="settings-label-row">
            <span class="settings-label">透明度</span>
            <span class="settings-value" id="bgOpacityValue">0.35</span>
          </div>
          <input type="range" id="bgOpacity" min="0.1" max="0.9" step="0.05" value="0.35" />
          <div class="range-labels"><span>浅</span><span>深</span></div>
        </div>

        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">背景图</span>
          </div>
          <div class="bg-controls">
            <button class="tb-btn" id="btnUploadBg" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="5.5" cy="6" r="1.2" fill="currentColor"/><path d="M2.5 12l3.5-3 2.5 2 2-2 3.5 3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
              <span>上传图片</span>
            </button>
            <button class="tb-btn" id="btnRemoveBg" type="button">
              <span>移除背景</span>
            </button>
          </div>
          <input type="file" id="bgFileInput" accept="image/*" class="hidden" />
        </div>

        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">最近上传的背景</span>
            <span class="settings-value">最多保留 10 张</span>
            <button class="tb-btn" id="btnManageBg" type="button">管理</button>
          </div>
          <div class="bg-history" id="bgHistory"></div>
          <!-- 管理模式操作（仅管理时显示）：缩略图右下角 -->
          <div class="bg-manage-actions hidden" id="bgManageActions">
            <button class="tb-btn" id="btnBgCancel" type="button">取消</button>
            <button class="tb-btn danger hidden" id="btnDeleteBg" type="button">删除选中</button>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h3>快捷键设置</h3>
        <p class="settings-hint">开关控制启用；点击按键重新绑定（需包含 Ctrl/Alt 组合键），按 Backspace 取消绑定，按 Esc 退出</p>
        <div class="shortcut-list" id="shortcutList"></div>
      </section>

      <section class="settings-section">
        <h3>数据保存</h3>
        <div class="settings-block">
          <div class="settings-label-row">
            <span class="settings-label">当前存储位置</span>
            <button class="tb-btn" id="btnOpenStorage" type="button">打开位置</button>
            <button class="tb-btn" id="btnChangeStorage" type="button">修改</button>
          </div>
          <p class="storage-path" id="storageDir">…</p>
          <div class="storage-files">
            <div class="storage-file-row"><span class="storage-file-label">待办数据</span><code id="storageNoteFile">…</code></div>
            <div class="storage-file-row"><span class="storage-file-label">设置</span><code id="storageSettingsFile">…</code></div>
          </div>
          <p class="storage-hint" id="storageHint"></p>
        </div>
      </section>
    </div>
  </div>

  <!-- 批量删除确认弹窗 -->
  <div class="confirm-mask hidden" id="confirmMask">
    <div class="confirm-card">
      <h3>确认删除</h3>
      <p class="confirm-text" id="confirmText"></p>
      <div class="confirm-actions">
        <button class="tb-btn" id="btnConfirmCancel" type="button">取消</button>
        <button class="tb-btn danger" id="btnConfirmOk" type="button">删除</button>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
