<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* mini 独立窗口专用微调：56×56 固定视口，球固定在左上角充满窗口 */
    html, body {
      width: 56px;
      height: 56px;
      overflow: hidden;
      background: transparent;
    }
    .mini-bar {
      left: 0;
      top: 0;
    }
  </style>
</head>
<!-- is-mini：复用主窗口样式表的透明背景（body.is-mini { background: transparent }） -->
<body class="is-mini">
  <div class="mini-bar hidden" id="miniBar" title="点击展开（退出 mini）">
    <div class="mini-dot"></div>
    <div class="mini-count" id="miniCount">0</div>
    <div class="mini-label">待办</div>
  </div>
  <script src="mini-ball.js"></script>
</body>
</html>
