<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;" />
  <title>EzTxt 自定义动画主题</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      /* 主题色兜底值（JS 启动时按用户设置覆盖，与 custom-theme.html 一致） */
      --accent: #e0a82e;
      --accent-rgb: 224, 168, 46;
      --accent-soft: rgba(224, 168, 46, 0.18);
      --ink: #4a3f24;
      --ink-rgb: 74, 63, 36;
      --ink-soft: #7a6e4f;
      --ink-mute: #b3a479;
      --line: rgba(74, 63, 36, 0.12);
      --line-soft: rgba(74, 63, 36, 0.06);
      --bg-solid: #FAF5E1;
      --bg-rgb: 250, 245, 225;
      --surface: rgba(255, 255, 255, 0.75);
      --surface-strong: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: var(--ink);
      overflow: hidden;
      user-select: none;
    }

    .window {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 16px);
      margin: 8px;
      background: var(--bg-solid);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* ===== 标题栏（可拖动） ===== */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 6px 0 16px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      app-region: drag;
      flex-shrink: 0;
    }
    .titlebar .title { font-weight: 600; font-size: 13px; color: var(--ink); }
    .win-controls { display: flex; gap: 2px; -webkit-app-region: no-drag; app-region: no-drag; }
    .win-controls button {
      width: 34px; height: 28px;
      border: none; background: transparent;
      border-radius: 6px; cursor: pointer;
      font-size: 13px; color: var(--ink-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .win-controls button:hover { background: rgba(var(--ink-rgb), 0.08); color: var(--ink); }

    /* ===== 主体（可滚动） ===== */
    .content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }

    /* 滚动条与主窗口统一 */
    *::-webkit-scrollbar { width: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: rgba(var(--ink-rgb), 0.18);
      border-radius: 6px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover { background-color: rgba(var(--ink-rgb), 0.3); }

    /* ===== 主题名称 ===== */
    .name-row { display: flex; flex-direction: column; gap: 6px; }
    .name-row label {
      font-size: 11px; font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .name-row input[type="text"] {
      height: 34px; padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      background: var(--surface-strong); color: var(--ink);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .name-row input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.15);
    }
    .name-row input.error {
      border-color: #d9534f;
      box-shadow: 0 0 0 2px rgba(217, 83, 79, 0.15);
    }
    .name-error {
      font-size: 11px; color: #d9534f;
      display: none;
    }
    .name-error.show { display: block; }

    /* ===== 区块 ===== */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-head h3 {
      margin: 0; font-size: 11px; font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .section-hint {
      font-size: 11px; color: var(--ink-mute);
      line-height: 1.5;
    }

    /* ===== 缩略图槽位行（闲时动画多个） ===== */
    .slots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }
    .slots.empty-hint::after {
      content: "点击「添加」上传第一张闲时动画";
      font-size: 11px; color: var(--ink-mute);
      font-style: italic;
    }

    /* 单个槽位：56×56 预览 + 删除角标 */
    .slot {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }
    .slot-preview {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 1.5px dashed var(--line);
      background: var(--surface-strong);
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .slot-preview:hover { border-color: var(--accent); transform: scale(1.04); }
    .slot.has-image .slot-preview { border-style: solid; border-color: var(--line); }
    .slot-preview::before {
      content: "＋";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px; color: var(--ink-soft);
      pointer-events: none;
      opacity: 0.6;
    }
    .slot.has-image .slot-preview::before { display: none; }

    /* 删除角标（hover 槽位时浮现） */
    .slot-del {
      position: absolute;
      top: -6px; right: -6px;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: none;
      background: #d9534f;
      color: #fff;
      font-size: 11px;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 1;
    }
    .slot:hover .slot-del { opacity: 1; transform: scale(1); }
    .slot-del:hover { background: #b8433f; }

    /* 单槽位行（慢速/快速打字） */
    .single-slot-row {
      display: flex; align-items: center; gap: 10px;
    }

    /* 区块内操作按钮（添加 / 上传） */
    .mini-btn {
      height: 26px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-strong);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .mini-btn:hover { background: var(--surface); border-color: var(--accent); }
    .mini-btn:active { transform: scale(0.97); }

    /* ===== 底部操作栏 ===== */
    .actions {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }
    .btn {
      flex: 1;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--ink);
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--surface); }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .btn.primary:hover { background: var(--accent); filter: brightness(0.88); }
    .btn.danger-ghost { color: #a05555; }
    .btn.danger-ghost:hover { background: rgba(217, 83, 79, 0.08); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="window">
    <!-- 标题栏 -->
    <div class="titlebar">
      <span class="title">自定义动画主题</span>
      <div class="win-controls">
        <button id="winClose" title="关闭">✕</button>
      </div>
    </div>

    <!-- 主体 -->
    <div class="content">
      <!-- 主题名称 -->
      <div class="name-row">
        <label>主题名称（必填）</label>
        <input type="text" id="themeName" placeholder="动画主题名称" maxlength="20" spellcheck="false" />
        <span class="name-error" id="nameError">请先填写主题名称再保存</span>
      </div>

      <!-- 闲时动画 -->
      <div class="section">
        <div class="section-head">
          <h3>闲时动画</h3>
          <button class="mini-btn" id="btnAddIdle" title="添加一个上传槽位">添加</button>
        </div>
        <div class="slots empty-hint" id="idleSlots"></div>
        <p class="section-hint">点击槽位上传 GIF，可添加多张用于轮换播放。</p>
      </div>

      <!-- 慢速打字 -->
      <div class="section">
        <div class="section-head">
          <h3>慢速打字</h3>
        </div>
        <div class="single-slot-row">
          <div class="slot" id="slowSlot">
            <div class="slot-preview"></div>
          </div>
          <button class="mini-btn" id="btnUploadSlow">上传</button>
        </div>
        <p class="section-hint">用户慢速输入时播放的动画（可选）。</p>
      </div>

      <!-- 快速打字 -->
      <div class="section">
        <div class="section-head">
          <h3>快速打字</h3>
        </div>
        <div class="single-slot-row">
          <div class="slot" id="fastSlot">
            <div class="slot-preview"></div>
          </div>
          <button class="mini-btn" id="btnUploadFast">上传</button>
        </div>
        <p class="section-hint">用户快速输入时播放的动画（可选）。</p>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="actions">
      <button class="btn danger-ghost" id="btnDelete" style="display:none;">删 除</button>
      <button class="btn primary" id="btnSave">保 存</button>
    </div>
  </div>

  <script src="custom-gif-theme.js" defer></script>
</body>
</html>
